<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Calculator</title>
    <link rel="stylesheet" href="114306051_JS2_HW8.css">
</head>
<body>
    <div class="calculator-container">
        <div class="calculator-card">
            <h3 class="card-title">JS Calculator</h3>
            
            <label for="num1">Number 1</label>
            <input type="number" id="num1" value="">
            
            <label for="num2">Number 2</label>
            <input type="number" id="num2" value="">
            
            <label for="operator">Operate way?</label>
            <select id="operator">
                <option value="add">+</option>
                <option value="subtract">-</option>
                <option value="multiply">*</option>
                <option value="divide">/</option>
            </select>
            
            <button id="calculateBtn">Add</button> 
            
            <p id="resultDisplay">Result = 0.00</p>
        </div>
    </div>

    <script src="114306051_JS2_HW8.js"></script>
</body>
</html>
